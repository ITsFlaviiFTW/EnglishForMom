# Temporary HTTP-only site used once, before the HTTPS certificate exists,
# so Let's Encrypt can check the domain. remote-install.sh replaces it with
# nginx-prava.conf right after the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name english.flavstudios.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 404;
    }
}
