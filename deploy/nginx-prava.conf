# /etc/nginx/sites-available/prava  (installed by deploy/remote-install.sh)
# Static PWA built by `npm run build:web`; each release lives in
# /srv/apps/prava/releases/<build-id>, and /srv/apps/prava/current points at the live one.

server {
    listen 80;
    listen [::]:80;
    server_name english.flavstudios.dev;

    # Let's Encrypt renewals (webroot method).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name english.flavstudios.dev;

    ssl_certificate /etc/letsencrypt/live/english.flavstudios.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.flavstudios.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/apps/prava/current;
    charset utf-8;
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;

    # Scripts and audio have the content hash in their file names: cache for a year.
    location /_expo/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location /assets/ {
        # Nginx's default type list has no .wav; without this, audio goes out as
        # application/octet-stream, which Safari may refuse to play (nosniff).
        types {
            audio/wav wav;
            audio/mpeg mp3;
            audio/mp4 m4a;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            font/ttf ttf;
            font/woff2 woff2;
            application/json json;
        }
        expires 1y;
        try_files $uri =404;
    }

    location /icons/ {
        expires 7d;
        try_files $uri =404;
    }

    # Always revalidated, so new releases reach installed apps.
    location = /sw.js {
        expires epoch;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires epoch;
        try_files $uri =404;
    }

    # Every lesson URL is served by the one pre-rendered lesson page.
    location ~ ^/lessons/[^/]+$ {
        expires epoch;
        try_files $uri "/lessons/[lessonId].html" =404;
    }

    location / {
        expires epoch;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
