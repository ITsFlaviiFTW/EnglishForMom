# /etc/nginx/sites-available/prava  (installed by deploy/remote-install.sh)
# Static PWA built by `npm run build:web`; each release lives in
# /srv/apps/prava/releases/<build-id>, and /srv/apps/prava/current points at the live one.

# Speaking check limits (see /api/pronunciation below): per phone, and for the
# whole site, so nobody else can use up the free Azure speech allowance.
limit_req_zone $binary_remote_addr zone=prava_speech_ip:1m rate=20r/m;
limit_req_zone $server_name zone=prava_speech_all:1m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name english.flavstudios.dev;

    # Let's Encrypt renewals (webroot method).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name english.flavstudios.dev;

    ssl_certificate /etc/letsencrypt/live/english.flavstudios.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.flavstudios.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/apps/prava/current;
    charset utf-8;
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;

    # Scripts and audio have the content hash in their file names: cache for a year.
    location /_expo/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location /assets/ {
        # Nginx's default type list has no .wav; without this, audio goes out as
        # application/octet-stream, which Safari may refuse to play (nosniff).
        types {
            audio/wav wav;
            audio/mpeg mp3;
            audio/mp4 m4a;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            font/ttf ttf;
            font/woff2 woff2;
            application/json json;
        }
        expires 1y;
        try_files $uri =404;
    }

    location /icons/ {
        expires 7d;
        try_files $uri =404;
    }

    # Always revalidated, so new releases reach installed apps.
    location = /sw.js {
        expires epoch;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires epoch;
        try_files $uri =404;
    }

    # "Acum spune tu": the app posts a short 16 kHz WAV here and gets back
    # Azure's pronunciation assessment. The Azure address and key come from
    # /etc/nginx/prava-secrets/speech.conf, which exists only on the server
    # (written by deploy/install-speech-key.sh). Without that file this
    # answers 405 and the app lets her continue without the check.
    location = /api/pronunciation {
        limit_except POST { deny all; }
        limit_req zone=prava_speech_ip burst=10 nodelay;
        limit_req zone=prava_speech_all burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;

        include /etc/nginx/prava-secrets/*.conf;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Every lesson URL is served by the one pre-rendered lesson page.
    location ~ ^/lessons/[^/]+$ {
        expires epoch;
        try_files $uri "/lessons/[lessonId].html" =404;
    }

    location / {
        expires epoch;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
